[package]
name = "backend-rove"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
futures = "0.3.34"
reqwest = "0.13.5"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1.19"



[[bin]]
name = "server"
path = "./src/server.rs"

[[bin]]
name = "client"
path = "./src/client.rs"
