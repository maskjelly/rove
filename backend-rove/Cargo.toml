[package]
name = "backend-rove"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time", "sync", "signal"] }
tokio-stream = "0.1.19"



[[bin]]
name = "server"
path = "./src/server.rs"

[[bin]]
name = "client"
path = "./src/client.rs"
